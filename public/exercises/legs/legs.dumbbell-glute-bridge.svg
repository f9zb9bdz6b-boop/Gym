  <text x="368" y="44" text-anchor="end" fill="#a1a1aa" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="500">dumbbell/mat</text>
  
      <line x1="155" y1="125" x2="245" y2="125" stroke="#e4e4e7" stroke-width="6" stroke-linecap="round"/>
      <rect x="138" y="104" width="18" height="42" rx="4" fill="#a3e635"/>
